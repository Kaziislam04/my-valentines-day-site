<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be My Valentine 💖</title>
<style>
    body {
        margin: 0;
        overflow: hidden;
        font-family: 'Arial', sans-serif;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
    }

    h1 {
        color: white;
        font-size: 3em;
        text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
        animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
    }

    .container {
        position: relative;
        z-index: 2;
    }

    button {
        padding: 15px 30px;
        font-size: 1.2em;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        margin: 20px;
        transition: all 0.3s ease;
    }

    #yesBtn {
        background-color: #ff4d6d;
        color: white;
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    #yesBtn:hover {
        background-color: #ff1e4d;
        transform: scale(1.1);
    }

    #noBtn {
        background-color: white;
        color: #ff4d6d;
        position: absolute;
    }

    /* Balloons */
    .balloon {
        position: absolute;
        bottom: -150px;
        width: 60px;
        height: 80px;
        background-color: red;
        border-radius: 50%;
        animation: float 10s linear infinite;
    }

    .balloon:after {
        content: '';
        position: absolute;
        width: 2px;
        height: 50px;
        background: #555;
        top: 80px;
        left: 50%;
    }

    @keyframes float {
        0% {
            transform: translateY(0);
            opacity: 1;
        }
        100% {
            transform: translateY(-120vh);
            opacity: 0;
        }
    }

</style>
</head>
<body>

<div class="container">
    <h1>Will You Be My Valentine? 💘</h1>
    <button id="yesBtn" onclick="yesClicked()">Yes 💖</button>
    <button id="noBtn">No 😢</button>
</div>

<script>
    const noBtn = document.getElementById("noBtn");

    noBtn.addEventListener("mouseover", () => {
        const x = Math.random() * (window.innerWidth - 100);
        const y = Math.random() * (window.innerHeight - 50);
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
    });

    function yesClicked() {
        document.body.innerHTML = `
            <div style="display:flex;justify-content:center;align-items:center;height:100vh;background:linear-gradient(135deg,#ff4d6d,#ff9a9e);color:white;font-size:3em;text-align:center;">
                Yay!!! 💕🥰<br>Best Valentine Ever! 💖🎉
            </div>
        `;
    }

    // Create balloons
    function createBalloon() {
        const balloon = document.createElement("div");
        balloon.classList.add("balloon");
        balloon.style.left = Math.random() * window.innerWidth + "px";
        balloon.style.backgroundColor = ["#ff4d6d", "#ff758f", "#ff8fa3", "#ffb3c6"][Math.floor(Math.random()*4)];
        balloon.style.animationDuration = (6 + Math.random() * 5) + "s";
        document.body.appendChild(balloon);

        setTimeout(() => {
            balloon.remove();
        }, 10000);
    }

    setInterval(createBalloon, 800);
</script>

</body>
</html>
